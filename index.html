<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="countdown-card" aria-labelledby="page-title">
      <p class="greeting">Hello KK Family, Good Day</p>
      <p class="eyebrow">The holiday is on its way</p>
      <h1 id="page-title">Christmas Countdown</h1>
      <p class="intro">Until December 25</p>

      <section class="timer" aria-label="Time remaining until Christmas">
        <div class="time-unit">
          <strong id="days">0</strong>
          <span>Days</span>
        </div>
        <div class="time-unit">
          <strong id="hours">0</strong>
          <span>Hours</span>
        </div>
        <div class="time-unit">
          <strong id="minutes">0</strong>
          <span>Minutes</span>
        </div>
        <div class="time-unit">
          <strong id="seconds">0</strong>
          <span>Seconds</span>
        </div>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
      <button id="music-toggle" class="music-toggle" type="button">Play background music</button>
    </main>
    <iframe
      class="background-audio"
      title="Boulevard of Broken Dreams by Green Day"
      src="https://www.youtube.com/embed/hBvJyi3fbtA?autoplay=1&loop=1&playlist=hBvJyi3fbtA&controls=0&rel=0"
      allow="autoplay; encrypted-media"
    ></iframe>
    <script src="script.js"></script>
  </body>
</html>
